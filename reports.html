<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | Power Tools Bus Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="reports" data-page-title="Reports | Power Tools Bus Services">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <i class="bi bi-bus-front"></i>
          <div>
            <strong>Power Tools</strong>
            <small>Bus Services</small>
          </div>
        </div>
        <ul id="sidebar-nav" class="nav flex-column"></ul>
      </aside>

      <main class="main-content">
        <header class="topbar" data-app-header></header>

        <section class="page-section">
          <div class="row g-3">
            <div class="col-md-4"><input type="date" class="form-control" /></div>
            <div class="col-md-4"><input type="date" class="form-control" /></div>
            <div class="col-md-4 text-md-end"><button class="btn btn-primary">Export PDF</button></div>
          </div>
        </section>

        <section class="page-section">
          <div class="row g-4">
            <div class="col-md-6">
              <div class="panel-card">
                <h4>Daily booking report</h4>
                <p class="report-summary">214 bookings processed</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="panel-card">
                <h4>Weekly revenue report</h4>
                <p class="report-summary">ZMW 267,400</p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
