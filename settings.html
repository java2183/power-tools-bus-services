<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Power Tools Bus Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="settings" data-page-title="Settings | Power Tools Bus Services">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <i class="bi bi-bus-front"></i>
          <div>
            <strong>Power Tools</strong>
            <small>Bus Services</small>
          </div>
        </div>
        <ul id="sidebar-nav" class="nav flex-column"></ul>
      </aside>

      <main class="main-content">
        <header class="topbar" data-app-header></header>

        <section class="page-section">
          <div class="panel-card">
            <div class="panel-header">
              <h4>Company settings</h4>
            </div>
            <form id="settingsForm" class="row g-3">
              <div class="col-md-6"><label class="form-label">Company name</label><input class="form-control" value="Power Tools Bus Services" /></div>
              <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="info@powertoolsbus.com" /></div>
              <div class="col-md-6"><label class="form-label">WhatsApp</label><input class="form-control" value="+260977123456" /></div>
              <div class="col-md-6"><label class="form-label">Currency</label><input class="form-control" value="ZMW" /></div>
              <div class="col-12"><label class="form-label">Address</label><input class="form-control" value="Lusaka, Zambia" /></div>
              <div class="col-12 text-end"><button class="btn btn-primary" type="submit">Save settings</button></div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
