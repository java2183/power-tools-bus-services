<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routes | Power Tools Bus Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="routes" data-page-title="Routes | Power Tools Bus Services">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <i class="bi bi-bus-front"></i>
          <div>
            <strong>Power Tools</strong>
            <small>Bus Services</small>
          </div>
        </div>
        <ul id="sidebar-nav" class="nav flex-column"></ul>
      </aside>

      <main class="main-content">
        <header class="topbar" data-app-header></header>

        <section class="page-section">
          <div class="row g-3">
            <div class="col-md-6 col-xl-3"><input class="form-control" placeholder="Departure" /></div>
            <div class="col-md-6 col-xl-3"><input class="form-control" placeholder="Destination" /></div>
            <div class="col-md-6 col-xl-3"><input class="form-control" placeholder="Price" /></div>
            <div class="col-md-6 col-xl-3 text-md-end"><button class="btn btn-primary">Add Route</button></div>
          </div>
        </section>

        <section class="page-section">
          <div class="panel-card">
            <div class="panel-header">
              <h4>Route catalogue</h4>
            </div>
            <div class="table-responsive">
              <table class="table modern-table">
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Price</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="routesTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
