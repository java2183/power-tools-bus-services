<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickets | Power Tools Bus Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="tickets" data-page-title="Tickets | Power Tools Bus Services">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <i class="bi bi-bus-front"></i>
          <div>
            <strong>Power Tools</strong>
            <small>Bus Services</small>
          </div>
        </div>
        <ul id="sidebar-nav" class="nav flex-column"></ul>
      </aside>

      <main class="main-content">
        <header class="topbar" data-app-header></header>

        <section class="page-section">
          <div class="row g-3">
            <div class="col-md-4"><input class="form-control" placeholder="Booking reference" /></div>
            <div class="col-md-4"><input class="form-control" placeholder="Passenger name" /></div>
            <div class="col-md-4 text-md-end"><button class="btn btn-primary">Verify Ticket</button></div>
          </div>
        </section>

        <section class="page-section">
          <div class="panel-card ticket-card">
            <div class="ticket-brand">
              <strong>Power Tools Bus Services</strong>
              <span>Booking confirmation</span>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <p><strong>Passenger:</strong> Joseph Phiri</p>
                <p><strong>Route:</strong> Lusaka to Ndola</p>
                <p><strong>Date:</strong> 12 Mar 2026</p>
              </div>
              <div class="col-md-6">
                <p><strong>Seat:</strong> 12</p>
                <p><strong>Amount:</strong> ZMW 520</p>
                <p><strong>Ref:</strong> PTB-1001</p>
              </div>
            </div>
            <div class="qr-box">QR</div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
