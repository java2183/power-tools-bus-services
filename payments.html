<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payments | Power Tools Bus Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="payments" data-page-title="Payments | Power Tools Bus Services">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <i class="bi bi-bus-front"></i>
          <div>
            <strong>Power Tools</strong>
            <small>Bus Services</small>
          </div>
        </div>
        <ul id="sidebar-nav" class="nav flex-column"></ul>
      </aside>

      <main class="main-content">
        <header class="topbar" data-app-header></header>

        <section class="page-section">
          <div class="row g-3">
            <div class="col-md-3"><input class="form-control" placeholder="Search tx ref" /></div>
            <div class="col-md-3"><select class="form-select"><option>Payment method</option><option>Cash</option></select></div>
            <div class="col-md-3"><input class="form-control" type="date" /></div>
            <div class="col-md-3 text-md-end"><button class="btn btn-primary">Record Payment</button></div>
          </div>
        </section>

        <section class="page-section">
          <div class="panel-card">
            <div class="panel-header">
              <h4>Payment registry</h4>
            </div>
            <div class="table-responsive">
              <table class="table modern-table">
                <thead>
                  <tr>
                    <th>Booking</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Time</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>PTB-1001</td>
                    <td>ZMW 520</td>
                    <td>Mobile Money</td>
                    <td><span class="badge status-active">Paid</span></td>
                    <td>Today</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
